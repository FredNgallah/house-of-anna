<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House of Anna | Luxury Collections</title>
    <style>
        :root {
            --bg-dark: #0a0908;
            --text-light: #fdfcf7;
            --brand-gold: #c5a059;
            --accent: #1a1714;
        }
        body { font-family: 'Playfair Display', serif; background-color: var(--bg-dark); color: var(--text-light); margin: 0; }
        
        header { padding: 3rem 2rem; text-align: center; border-bottom: 1px solid var(--accent); }
        .logo { font-size: 2.5rem; letter-spacing: 0.2rem; text-transform: uppercase; margin-bottom: 1.5rem; display: block; color: var(--text-light); text-decoration: none; }
        
        /* Unified Grid */
        .gallery-container { padding: 4rem 2rem; max-width: 1100px; margin: 0 auto; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 2rem; }
        
        /* Card & Video Styling */
        .item-card { background: #111; overflow: hidden; }
        .item-card img, .item-card video { width: 100%; aspect-ratio: 4/5; object-fit: cover; transition: transform 0.5s ease; }
        .item-card:hover img, .item-card:hover video { transform: scale(1.03); }
        
        .content-label { padding: 1rem; text-align: center; font-size: 0.8rem; letter-spacing: 0.1rem; color: var(--brand-gold); }
    </style>
</head>
<body>

<header>
    <a href="#" class="logo">House of Anna</a>
</header>

<div class="gallery-container">
    <!-- VIDEO SECTION -->
    <h2 style="text-align: center; margin-bottom: 3rem; font-weight: 300;">In Motion</h2>
    <div class="grid">
        <div class="item-card">
            <video autoplay loop muted playsinline poster="">
                <source src="https://res.cloudinary.com/ujv5gsw6/video/upload/v1784855732/WhatsApp_Video_2026-07-24_at_4.07.50_AM_1_g5w6qb.mp4" type="video/mp4">
            </video>
            <div class="content-label">Amara Wrap Pants</div>
        </div>
        <div class="item-card">
            <video autoplay loop muted playsinline poster="">
                <source src="https://res.cloudinary.com/ujv5gsw6/video/upload/v1784855731/WhatsApp_Video_2026-07-24_at_4.07.07_AM_gncl2b.mp4" type="video/mp4">
            </video>
            <div class="content-label">Amara Wrap Pants</div>
        </div>
        <div class="item-card">
            <video autoplay loop muted playsinline poster="">
                <source src="https://res.cloudinary.com/ujv5gsw6/video/upload/v1784855705/WhatsApp_Video_2026-07-24_at_4.07.50_AM_b4guuu.mp4" type="video/mp4">
            </video>
            <div class="content-label">Amara Wrap Pants</div>
        </div>
        <div class="item-card">
            <video autoplay loop muted playsinline poster="">
                <source src="https://res.cloudinary.com/ujv5gsw6/video/upload/v1784855682/WhatsApp_Video_2026-07-24_at_4.07.51_AM_jouzzc.mp4" type="video/mp4">
            </video>
            <div class="content-label">Backless Dera</div>
        </div>
    </div>

    <!-- PHOTO SECTION -->
    <h2 style="text-align: center; margin: 4rem auto 3rem auto; font-weight: 300;">Static Collection</h2>
    <div class="grid">
        <!-- Add your photo cards here using the same .item-card structure -->
        <div class="item-card">
            <img src="https://i.ibb.co/VWC4tYF8/IMG-20260705-155412.jpg" alt="Product">
            <div class="content-label">Amara Wrap Pants</div>
        </div>
    </div>
</div>

</body>
</html>
