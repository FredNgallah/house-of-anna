<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Catalogue — House of Anna</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#0B0800;--card:#160D02;--card2:#1C1204;
  --border:rgba(196,154,44,.18);--border2:rgba(196,154,44,.08);
  --gold:#C49A2C;--green:#10b981;--red:#ef4444;--amber:#f59e0b;
  --cyan:#06b6d4;--purple:#8b5cf6;--pink:#ec4899;
  --text:#f5f0e8;--text2:rgba(245,240,232,.55);--text3:rgba(245,240,232,.35);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',sans-serif;min-height:100vh;}
.site-header{display:flex;align-items:center;justify-content:space-between;padding:18px 28px;border-bottom:1px solid var(--border2);background:rgba(11,8,0,.92);position:sticky;top:0;z-index:100;backdrop-filter:blur(8px);}
.brand{display:flex;align-items:center;gap:12px;}
.brand img{height:38px;width:auto;}
.brand-text .brand-name{font-family:'Cormorant Garamond',serif;font-size:1.35rem;font-weight:700;color:var(--gold);letter-spacing:.04em;line-height:1.1;}
.brand-text .brand-sub{font-size:.65rem;color:var(--text2);letter-spacing:.14em;text-transform:uppercase;}
.nav-links{display:flex;gap:8px;flex-wrap:wrap;}
.nav-btn{padding:7px 13px;border-radius:7px;border:1px solid var(--border);background:transparent;color:var(--text2);font-size:.75rem;font-weight:500;cursor:pointer;text-decoration:none;transition:all .2s;font-family:'Plus Jakarta Sans',sans-serif;letter-spacing:.02em;}
.nav-btn:hover{background:rgba(196,154,44,.08);color:var(--text);border-color:rgba(196,154,44,.35);}
.nav-btn.amber{border-color:rgba(245,158,11,.35);color:#fbbf24;}
.nav-btn.amber:hover{background:rgba(245,158,11,.08);}
.nav-btn.red-nav{border-color:rgba(239,68,68,.3);color:#f87171;}
.nav-btn.red-nav:hover{background:rgba(239,68,68,.08);}
.nav-btn.pink-nav{border-color:rgba(236,72,153,.3);color:#f472b6;}
.nav-btn.pink-nav:hover{background:rgba(236,72,153,.08);}
.nav-btn.active-gold{background:rgba(196,154,44,.15);border-color:rgba(196,154,44,.5);color:var(--gold);cursor:default;}
.page-main{max-width:1320px;margin:0 auto;padding:28px 24px 48px;}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px;}
.page-title{font-family:'Cormorant Garamond',serif;font-size:1.75rem;font-weight:700;}
.page-title span{color:var(--gold);}
.header-actions{display:flex;gap:10px;align-items:center;}
.shop-link-btn{display:flex;align-items:center;gap:7px;padding:9px 16px;background:rgba(196,154,44,.12);border:1px solid rgba(196,154,44,.35);border-radius:8px;color:var(--gold);font-size:.78rem;font-weight:600;cursor:pointer;text-decoration:none;font-family:'Plus Jakarta Sans',sans-serif;transition:all .2s;}
.shop-link-btn:hover{background:rgba(196,154,44,.22);}
.filter-row{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap;}
.filter-row select,.filter-row input{background:var(--card);border:1px solid var(--border);border-radius:7px;color:var(--text2);font-size:.78rem;font-family:'Plus Jakarta Sans',sans-serif;padding:7px 12px;outline:none;}
.filter-row input{color:var(--text);}
.filter-row input::placeholder{color:var(--text3);}
.record-count{font-size:.72rem;color:var(--text3);margin-left:auto;}
.catalogue-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px;}
.prod-card{background:var(--card);border:1px solid var(--border2);border-radius:14px;overflow:hidden;transition:border-color .2s;}
.prod-card:hover{border-color:rgba(196,154,44,.3);}
.prod-card.hidden-cat{opacity:.45;}
.prod-img{width:100%;height:200px;object-fit:cover;display:block;}
.prod-img-placeholder{width:100%;height:200px;display:flex;align-items:center;justify-content:center;background:var(--card2);font-family:'Cormorant Garamond',serif;font-size:2.5rem;font-weight:700;color:rgba(196,154,44,.3);letter-spacing:.1em;}
.prod-body{padding:16px;}
.prod-name{font-family:'Cormorant Garamond',serif;font-size:1.15rem;font-weight:700;color:var(--text);margin-bottom:4px;line-height:1.2;}
.prod-cat{font-size:.68rem;color:var(--text3);text-transform:uppercase;letter-spacing:.09em;margin-bottom:10px;}
.prod-meta{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.prod-price{font-family:'Cormorant Garamond',serif;font-size:1.3rem;font-weight:700;color:var(--gold);}
.stock-badge{font-size:.68rem;font-weight:600;padding:3px 9px;border-radius:99px;}
.stock-badge.instock{background:rgba(16,185,129,.15);color:#34d399;border:1px solid rgba(16,185,129,.25);}
.stock-badge.lowstock{background:rgba(245,158,11,.15);color:#fbbf24;border:1px solid rgba(245,158,11,.25);}
.stock-badge.outstock{background:rgba(239,68,68,.12);color:#f87171;border:1px solid rgba(239,68,68,.2);}
.stock-badge.reserved{background:rgba(139,92,246,.12);color:#a78bfa;border:1px solid rgba(139,92,246,.2);}
.prod-desc{font-size:.75rem;color:var(--text2);line-height:1.5;margin-bottom:12px;min-height:36px;}
.prod-actions{display:flex;gap:8px;align-items:center;justify-content:space-between;}
.btn-edit{padding:6px 14px;background:transparent;border:1px solid var(--border);border-radius:6px;color:var(--text2);font-size:.72rem;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;transition:all .18s;}
.btn-edit:hover{border-color:rgba(196,154,44,.4);color:var(--gold);}
.toggle-vis{display:flex;align-items:center;gap:6px;font-size:.7rem;color:var(--text3);cursor:pointer;user-select:none;}
.toggle-vis input[type=checkbox]{accent-color:var(--gold);width:14px;height:14px;}
/* EDIT MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal-overlay.hidden{display:none;}
.modal{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:24px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;}
.modal-title{font-family:'Cormorant Garamond',serif;font-size:1.2rem;font-weight:700;margin-bottom:18px;padding-bottom:10px;border-bottom:1px solid var(--border2);}
.form-group{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;}
.form-group label{font-size:.7rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);}
.form-group input,.form-group textarea{background:var(--card2);border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:.83rem;font-family:'Plus Jakarta Sans',sans-serif;padding:9px 12px;outline:none;transition:border-color .18s;}
.form-group input:focus,.form-group textarea:focus{border-color:rgba(196,154,44,.5);}
.form-group textarea{resize:vertical;min-height:72px;}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;}
.btn-primary{padding:9px 22px;background:rgba(196,154,44,.18);border:1px solid rgba(196,154,44,.4);border-radius:7px;color:var(--gold);font-size:.82rem;font-weight:600;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;transition:all .2s;}
.btn-primary:hover{background:rgba(196,154,44,.3);}
.btn-secondary{padding:9px 18px;background:transparent;border:1px solid var(--border);border-radius:7px;color:var(--text2);font-size:.82rem;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;}
.form-msg{font-size:.78rem;padding:7px 12px;border-radius:6px;margin-top:8px;display:none;}
.form-msg.error{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);color:#f87171;display:block;}
.form-msg.success{background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.3);color:#34d399;display:block;}
.loading-overlay{position:fixed;inset:0;background:rgba(11,8,0,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;gap:14px;}
.spinner{width:36px;height:36px;border:3px solid rgba(196,154,44,.2);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-overlay.hidden{display:none;}
</style>
</head>
<body>
<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <div style="font-size:.8rem;color:var(--text2);letter-spacing:.06em;">Loading catalogue…</div>
</div>

<div class="modal-overlay hidden" id="editModal">
  <div class="modal">
    <div class="modal-title">Edit Product Details</div>
    <input type="hidden" id="editProductId"/>
    <div class="form-group">
      <label>Image URL</label>
      <input type="url" id="editImageUrl" placeholder="https://… (paste a hosted image link)"/>
    </div>
    <div class="form-group">
      <label>Product Description</label>
      <textarea id="editDesc" placeholder="Brief description shown in the shop…"></textarea>
    </div>
    <div class="form-group">
      <label>Sizes Available</label>
      <input type="text" id="editSizes" placeholder="e.g. S, M, L, XL, Free Size"/>
    </div>
    <div class="form-group">
      <label>Colours / Variants</label>
      <input type="text" id="editColours" placeholder="e.g. Black, Nude, Emerald"/>
    </div>
    <div id="editMsg" class="form-msg"></div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn-primary" onclick="saveEdit()">Save Changes</button>
    </div>
  </div>
</div>

<script>
const SB_URL = 'https://dyjfbxjeubmekelcdogi.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR5amZieGpldWJtZWtlbGNkb2dpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI2OTQ3NDcsImV4cCI6MjEwODI3MDc0N30.TCgZ5f28OCiRm1i6lJUFvRe9CVWw3xZPcCH7Z_-5-as';

let allProducts = [];
let editingId = null;

function sbFetch(path, opts={}) {
  return fetch(SB_URL+path, {
    ...opts,
    headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':opts.prefer||'',...(opts.headers||{})}
  });
}

async function loadAll() {
  try {
    const r = await sbFetch('/rest/v1/inventory?select=*&order=print_name.asc&limit=1000');
    if (!r.ok) throw new Error('HTTP '+r.status);
    allProducts = await r.json();
  } catch(e) { allProducts=[]; }
  document.getElementById('loadingOverlay').classList.add('hidden');
  // populate category filter
  const cats = [...new Set(allProducts.map(p=>p.category).filter(Boolean))].sort();
  const sel = document.getElementById('filterCat');
  cats.forEach(c=>{ const o=document.createElement('option'); o.value=o.textContent=c; sel.appendChild(o); });
  renderGrid();
}

function getNetStock(p) {
  return (Number(p.total_qty_stocked)||0) - (Number(p.reserved_qty)||0);
}

function stockStatus(p) {
  const net = getNetStock(p);
  if (net <= 0) return 'outstock';
  if (net <= 1) return 'lowstock';
  return 'instock';
}

function stockLabel(p) {
  const net = getNetStock(p);
  if (net <= 0) return 'Sold Out';
  if (net <= 1) return 'Last 1';
  return net + ' in stock';
}

function fmtKES(v) {
  const n = Number(v)||0;
  return 'KES '+n.toLocaleString('en-KE',{minimumFractionDigits:2,maximumFractionDigits:2});
}

function initials(name) {
  if (!name) return 'HOA';
  return name.split(' ').map(w=>w[0]).join('').slice(0,3).toUpperCase();
}

function applyFilter() {
  const q = document.getElementById('searchBox').value.toLowerCase();
  const cat = document.getElementById('filterCat').value;
  const st = document.getElementById('filterStatus').value;
  let filtered = allProducts;
  if (q) filtered = filtered.filter(p=>(p.print_name||'').toLowerCase().includes(q)||(p.category||'').toLowerCase().includes(q));
  if (cat) filtered = filtered.filter(p=>p.category===cat);
  if (st) filtered = filtered.filter(p=>stockStatus(p)===st);
  document.getElementById('recordCount').textContent = filtered.length+' product'+(filtered.length!==1?'s':'');
  renderGrid(filtered);
}

function renderGrid(products) {
  if (!products) products = allProducts;
  const grid = document.getElementById('catalogueGrid');
  if (!products.length) {
    grid.innerHTML='<div style="color:var(--text3);font-size:.82rem;padding:40px 0;grid-column:1/-1;text-align:center;">No products found.</div>';
    return;
  }
  grid.innerHTML = products.map(p => {
    const ss = stockStatus(p);
    const sl = stockLabel(p);
    const badgeClass = ss==='instock'?'instock':ss==='lowstock'?'lowstock':'outstock';
    const show = p.show_in_catalogue !== false;
    const imgHtml = p.image_url
      ? '<img class="prod-img" src="'+p.image_url+'" alt="'+escHtml(p.print_name||'')+'" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">'
        + '<div class="prod-img-placeholder" style="display:none">'+escHtml(initials(p.print_name))+'</div>'
      : '<div class="prod-img-placeholder">'+escHtml(initials(p.print_name))+'</div>';
    return '<div class="prod-card'+(show?'':' hidden-cat')+'" id="card-'+p.id+'">' +
      imgHtml +
      '<div class="prod-body">' +
        '<div class="prod-name">'+escHtml(p.print_name||'Unnamed')+'</div>' +
        '<div class="prod-cat">'+escHtml(p.category||'—')+'</div>' +
        '<div class="prod-meta">' +
          '<div class="prod-price">'+fmtKES(p.price||p.selling_price||p.unit_price||0)+'</div>' +
          '<span class="stock-badge '+badgeClass+'">'+sl+'</span>' +
        '</div>' +
        '<div class="prod-desc">'+escHtml(p.product_description||'')+'</div>' +
        (p.sizes_available ? '<div style="font-size:.7rem;color:var(--text2);margin-bottom:4px;">Sizes: '+escHtml(p.sizes_available)+'</div>' : '') +
        (p.colours_variants ? '<div style="font-size:.7rem;color:var(--text2);margin-bottom:10px;">Colours: '+escHtml(p.colours_variants)+'</div>' : '') +
        '<div class="prod-actions">' +
          '<button class="btn-edit" onclick="openEdit(''+p.id+'')">Edit Details</button>' +
          '<label class="toggle-vis"><input type="checkbox"'+(show?' checked':'')+ ' onchange="toggleVisibility(''+p.id+'',this.checked)"/> Show in Shop</label>' +
        '</div>' +
      '</div>' +
    '</div>';
  }).join('');
  document.getElementById('recordCount').textContent = products.length+' product'+(products.length!==1?'s':'');
}

function escHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function openEdit(id) {
  const p = allProducts.find(x=>x.id===id);
  if (!p) return;
  editingId = id;
  document.getElementById('editProductId').value = id;
  document.getElementById('editImageUrl').value = p.image_url||'';
  document.getElementById('editDesc').value = p.product_description||'';
  document.getElementById('editSizes').value = p.sizes_available||'';
  document.getElementById('editColours').value = p.colours_variants||'';
  document.getElementById('editMsg').className='form-msg';
  document.getElementById('editMsg').textContent='';
  document.getElementById('editModal').classList.remove('hidden');
}

function closeModal() {
  document.getElementById('editModal').classList.add('hidden');
  editingId = null;
}

async function saveEdit() {
  if (!editingId) return;
  const btn = document.querySelector('.btn-primary');
  btn.textContent='Saving…'; btn.disabled=true;
  const msg = document.getElementById('editMsg');
  try {
    const payload = {
      image_url: document.getElementById('editImageUrl').value.trim()||null,
      product_description: document.getElementById('editDesc').value.trim()||null,
      sizes_available: document.getElementById('editSizes').value.trim()||null,
      colours_variants: document.getElementById('editColours').value.trim()||null,
    };
    const r = await sbFetch('/rest/v1/inventory?id=eq.'+editingId, {
      method:'PATCH', prefer:'return=representation', body:JSON.stringify(payload)
    });
    if (!r.ok) { const err=await r.json().catch(()=>({})); throw new Error(err.message||'HTTP '+r.status); }
    const [updated] = await r.json();
    const idx = allProducts.findIndex(p=>p.id===editingId);
    if (idx>=0) allProducts[idx]={...allProducts[idx],...updated};
    msg.className='form-msg success'; msg.textContent='Saved!';
    setTimeout(()=>{ closeModal(); applyFilter(); },800);
  } catch(e) {
    msg.className='form-msg error'; msg.textContent='Error: '+e.message;
  } finally { btn.textContent='Save Changes'; btn.disabled=false; }
}

async function toggleVisibility(id, show) {
  const card = document.getElementById('card-'+id);
  if (card) card.classList.toggle('hidden-cat', !show);
  const idx = allProducts.findIndex(p=>p.id===id);
  if (idx>=0) allProducts[idx].show_in_catalogue = show;
  try {
    await sbFetch('/rest/v1/inventory?id=eq.'+id, {
      method:'PATCH', body:JSON.stringify({show_in_catalogue:show})
    });
  } catch(e) { console.warn('Toggle error:', e); }
}

loadAll();
</script>
</body>
</html>
